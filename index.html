<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя, Жаным 💘</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #e11d48; --bg: #1f020a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #881337 0%, #4c0519 50%, #1f020a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            overflow: hidden;
        }

        /* Анимация фона */
        .bg-layer { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events: none; }
        .emoji { position: absolute; font-size: 24px; animation: floatUp linear infinite; opacity: 0.3; }
        @keyframes floatUp { from { transform: translateY(110vh); } to { transform: translateY(-10vh); } }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            z-index: 1;
            position: relative;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 25px; line-height: 1.2; }
        
        .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.1); margin-bottom: 30px; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: #f472b6; width: 0%; transition: width 0.5s ease; }

        .btn { padding: 16px 40px; border-radius: 50px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 1rem; margin: 5px; }
        .btn:active { transform: scale(0.92); }
        .btn-yes { background: var(--accent); color: white; box-shadow: 0 10px 20px rgba(225, 29, 72, 0.3); }
        .btn-no { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }

        .textarea { width: 100%; height: 100px; background: rgba(0,0,0,0.2); border: 1px solid #f472b6; border-radius: 20px; padding: 15px; color: #fff; margin-bottom: 20px; resize: none; font-family: inherit; }
        
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; max-height: 350px; overflow-y: auto; }
        .item { aspect-ratio: 1/1; border-radius: 15px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: rgba(255,255,255,0.5); }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="bg-layer" id="bg"></div>

    <div class="card">
        <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>

        <!-- Шаг 0 -->
        <div id="step0" class="step active">
            <h1>Будешь моей единственной? 💘</h1>
            <button class="btn btn-yes" onclick="nextStep(20, 'step1')">Да, конечно ✨</button>
            <button class="btn btn-no" id="noBtn" onmouseover="dodge()">Нет</button>
        </div>

        <!-- Шаг 1 -->
        <div id="step1" class="step">
            <h1>Помнишь тот самый день, когда мы начали общаться? 🗓️</h1>
            <textarea id="a1" class="textarea" placeholder="Напиши что помнишь..."></textarea>
            <button class="btn btn-yes" onclick="checkAndNext(40, 'step2', 'a1')">Продолжить</button>
        </div>

        <!-- Шаг 2 -->
        <div id="step2" class="step">
            <h1>Почему ты согласилась стать моей сладкой булочкой? 🥐</h1>
            <textarea id="a2" class="textarea" placeholder="Твои мысли..."></textarea>
            <button class="btn btn-yes" onclick="checkAndNext(60, 'stepPhotos', 'a2')">Дальше 💘</button>
        </div>

        <!-- Фото -->
        <div id="stepPhotos" class="step">
            <h1>Наши моменты 📸</h1>
            <div id="gridP" class="gallery"></div>
            <button class="btn btn-yes" style="margin-top:20px" onclick="nextStep(80, 'stepVideos')">Смотреть видео 🎬</button>
        </div>

        <!-- Видео -->
        <div id="stepVideos" class="step">
            <h1>Видео-липсинги 🎬</h1>
            <div id="gridV" class="gallery"></div>
            <button class="btn btn-yes" style="margin-top:20px" onclick="nextStep(100, 'stepQR')">Открыть подарок 🎁</button>
        </div>

        <!-- Подарок -->
        <div id="stepQR" class="step">
            <h1>Это для тебя, жаным 🎁</h1>
            <img src="1000135716.jpg" style="width:160px; border-radius:20px; border: 3px solid #fff; margin-bottom: 15px;">
            <div style="font-size: 0.9rem; line-height: 1.5; color: #ffe4e6; text-align: left; padding: 10px; background: rgba(0,0,0,0.2); border-radius:15px;">
                Жаным, 08.08 — наш день. Эта вещь лишь символ, но я дарю тебе частичку сердца. Будь моей всегда. 💘
            </div>
        </div>
    </div>

    <script>
        // Фон
        const em = ['👾', '💘', '🎈', '💋', '🦁'];
        setInterval(() => {
            const d = document.createElement('div');
            d.className = 'emoji';
            d.innerText = em[Math.floor(Math.random()*em.length)];
            d.style.left = Math.random()*100 + 'vw';
            d.style.animationDuration = (Math.random()*5 + 5) + 's';
            document.getElementById('bg').appendChild(d);
            setTimeout(() => d.remove(), 10000);
        }, 800);

        // Кнопка Нет (Dodge)
        function dodge() {
            const b = document.getElementById('noBtn');
            b.style.position = 'absolute';
            b.style.left = Math.random() * 70 + 10 + '%';
            b.style.top = Math.random() * 70 + 10 + '%';
        }

        // Логика переходов
        function nextStep(prog, id) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('prog').style.width = prog + '%';
            if(id === 'stepPhotos') render('gridP', 14, 'Фото');
            if(id === 'stepVideos') render('gridV', 6, 'Видео');
        }

        function checkAndNext(prog, id, areaId) {
            if(!document.getElementById(areaId).value.trim()) {
                alert("Жаным, напиши ответ, чтобы мы могли идти дальше 🥺");
                return;
            }
            nextStep(prog, id);
        }

        function render(id, c, t) {
            const g = document.getElementById(id);
            if(!g.innerHTML) {
                for(let i=1; i<=c; i++) g.innerHTML += `<div class="item">${t} ${i}</div>`;
            }
        }
    </script>
</body>
</html>
