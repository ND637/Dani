<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для моей любимой 💘</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #881337 0%, #4c0519 50%, #1f020a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            overflow: hidden;
        }
        .bg-layer { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events: none; }
        .emoji-float { position: absolute; font-size: 24px; animation: floatUp linear infinite; opacity: 0.5; }
        @keyframes floatUp { from { transform: translateY(110vh); } to { transform: translateY(-10vh); } }

        .card {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            z-index: 1;
            position: relative;
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s ease; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .btn { padding: 15px 40px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-yes { background: #e11d48; color: white; box-shadow: 0 5px 15px rgba(225, 29, 72, 0.4); }
        .btn-no { background: rgba(255,255,255,0.1); color: #ccc; }
        
        .textarea { width: 100%; height: 120px; background: rgba(255,255,255,0.05); border: 1px solid #e11d48; border-radius: 20px; padding: 15px; color: #fff; margin-bottom: 20px; resize: none; }
        .action-btn { width: 100%; padding: 15px; border-radius: 20px; background: #e11d48; color: #fff; border: none; font-weight: 600; cursor: pointer; margin-top: 10px; }
        
        .grid-photos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; max-height: 50vh; overflow-y: auto; }
        .card-img { aspect-ratio: 3/4; border-radius: 15px; background: #333; overflow: hidden; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="bg-layer" id="bg"></div>

    <div class="card">
        <!-- Шаг 0 -->
        <div id="step0" class="step active">
            <h1>Будешь моей девушкой? 💘</h1>
            <button class="btn btn-yes" onclick="goToStep('step1')">Да ✨</button>
            <button class="btn btn-no" id="noBtn">Нет</button>
        </div>

        <!-- Шаги ответов -->
        <div id="step1" class="step">
            <h1>Мысль на память 💭</h1>
            <textarea id="answer1" class="textarea" placeholder="Напиши что-то приятное..."></textarea>
            <button class="action-btn" onclick="submitAnswer(1, 'step2')">Отправить 💌</button>
        </div>

        <div id="step2" class="step">
            <h1>Почему ты моя булочка? 🥐</h1>
            <textarea id="answer2" class="textarea" placeholder="Твой ответ..."></textarea>
            <button class="action-btn" onclick="submitAnswer(2, 'stepPhotos')">Дальше 💘</button>
        </div>

        <!-- Галерея -->
        <div id="stepPhotos" class="step">
            <h1>Наши моменты 📸</h1>
            <div id="gridP" class="grid-photos"></div>
            <button class="action-btn" onclick="goToStep('stepVideos')">Смотреть видео 🎬</button>
        </div>

        <div id="stepVideos" class="step">
            <h1>Наши видео 🎬</h1>
            <div id="gridV" class="grid-photos"></div>
            <button class="action-btn" onclick="goToStep('stepQR')">Твой подарок 🎁</button>
        </div>

        <!-- QR -->
        <div id="stepQR" class="step">
            <h1>Это тебе, жаным 🎁</h1>
            <img src="1000135716.jpg" style="width:200px; border-radius:20px; margin: 20px 0;">
            <p>Береги это, как я берегу тебя.</p>
        </div>
    </div>

    <script>
        // 5 Эмодзи
        const emojis = ['👾', '💘', '🎈', '💋', '🦁'];
        function spawn() {
            const d = document.createElement('div');
            d.className = 'emoji-float';
            d.innerText = emojis[Math.floor(Math.random()*emojis.length)];
            d.style.left = Math.random()*100 + 'vw';
            d.style.animationDuration = (Math.random()*5 + 5) + 's';
            document.getElementById('bg').appendChild(d);
            setTimeout(() => d.remove(), 10000);
        }
        setInterval(spawn, 700);

        function goToStep(id) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'stepPhotos') renderPhotos();
            if(id === 'stepVideos') renderVideos();
        }

        // Логика проверки ответа
        function submitAnswer(num, next) {
            const val = document.getElementById('answer' + num).value.trim();
            if (!val) {
                alert("Жаным, напиши хоть слово! Без этого я не могу пропустить дальше 🥺");
                return;
            }
            // Тут fetch к боту...
            goToStep(next);
        }

        function renderPhotos() {
            const g = document.getElementById('gridP');
            if(!g.innerHTML) for(let i=1; i<=14; i++) g.innerHTML += `<div class="card-img" style="background:#555"></div>`;
        }
        
        function renderVideos() {
            const g = document.getElementById('gridV');
            if(!g.innerHTML) for(let i=1; i<=6; i++) g.innerHTML += `<div class="card-img" style="background:#000"></div>`;
        }

        const no = document.getElementById('noBtn');
        no.onmouseover = () => { no.style.position = 'fixed'; no.style.left = Math.random()*80 + 'vw'; no.style.top = Math.random()*80 + 'vh'; }
    </script>
</body>
</html>
