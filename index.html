<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя 💖</title>
    
    <!-- Красивый шрифт Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Применяем красивый шрифт везде */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdf2f8; /* Мягкий розовый фон */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #db2777;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px; /* Увеличенный размер шрифта */
            color: #4b5563;
            line-height: 1.6; /* Комфортный интервал */
            margin-bottom: 20px;
        }

        .btn {
            background: #db2777;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn:hover {
            background: #be185d;
        }
    </style>
</head>
<body>

<div class="card">
    <div id="content">
        <h1>Привет, любовь моя! 💖</h1>
        <p>Я очень долго думал, как тебе сказать о том, что чувствую...</p>
        <p>Ты — самое лучшее, что случалось со мной. Каждый момент, проведенный с тобой, делает меня счастливее.</p>
        <p>Скажи, ты хочешь быть со мной всегда?</p>
        <button class="btn" onclick="showQuestions()">Конечно, хочу!</button>
    </div>
</div>

<script>
    function showQuestions() {
        document.getElementById('content').innerHTML = `
            <h1>Ответь на вопросы 🥺</h1>
            <p>1. Какой твой любимый цвет?</p>
            <input type="text" id="q1" style="width: 80%; padding: 10px; margin-bottom: 10px;"><br>
            <p>2. Где бы ты хотела погулять со мной?</p>
            <input type="text" id="q2" style="width: 80%; padding: 10px; margin-bottom: 10px;"><br>
            <button class="btn" onclick="finish()">Готово</button>
        `;
    }

    function finish() {
        document.getElementById('content').innerHTML = `
            <h1>Я тебя люблю! 🌹</h1>
            <p>Спасибо за ответы! Теперь я знаю о тебе еще больше.</p>
            <p>Ты делаешь мой мир ярче. Давай создадим самые красивые воспоминания вместе!</p>
            <p><i>(Тут ты можешь добавить текст, который будет под QR-кодом)</i></p>
        `;
    }
</script>

</body>
</html>
